# One manifest for everyone: `uv sync` installs exactly what uv.lock says (CONTRIBUTING.md, section 1).
# Add runtime dependencies with `uv add <package>`; never with pip.
# Read by uv, ruff and pytest. What every file is for: docs/FILES.md.
[project]
name = "aib-hackathon-idealo"
version = "0.1.0"
description = "Hackathon prototype on the idealo MCP; the idea is picked on the day."
requires-python = ">=3.12"
dependencies = []

# Tools for writing and checking code; `uv sync` installs them, the agent itself does not need them.
[dependency-groups]
dev = [
    "ruff==0.17.6",  # exact pin: every person and agent formats the same way
    "pytest>=9",
]

[tool.ruff]
line-length = 100  # longest allowed line; `ruff format` wraps to it

[tool.ruff.lint]
# Rule groups, by code prefix. Several mirror a Norma rule (AGENTS.md, "House rules for code"),
# so the mistake shows up in `tools/check` before Norma reports it on the PR.
# E4/E7/E9/F: syntax errors, undefined names, unused imports, bare except
# BLE: no blind `except Exception` - mirrors Norma rule py-maint-broad-except
# I: one import order, so diffs from different agents do not fight
# B: bugbear - mutable defaults, swallowed exceptions
# T20: no print() - mirrors Norma rule py-maint-no-print; use logging
# DTZ: timezone-aware datetimes - mirrors py-maint-naive-datetime
# S113: requests without timeout - mirrors py-scal-requests-no-timeout
# S102/S307: exec/eval - mirror py-sec-eval-exec
select = ["E4", "E7", "E9", "F", "BLE", "I", "B", "T20", "DTZ", "S113", "S102", "S307"]

# Rules switched off for some folders only.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]  # print() allowed in tests
"tools/**" = ["T20"]  # command-line scripts print on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]  # where `uv run pytest` looks for tests
pythonpath = ["src"]  # tests can import the agent code in src/ without installing it
addopts = "-q"  # short output
