# Same gate for every author: lint, format, tests, and a filled PR description (CONTRIBUTING.md, sections 3 and 8).
# Jobs: pr / lint-test and pr / blocks-filled. What to do when one is red: docs/FILES.md.
name: pr
on:
  pull_request:
    # `edited`: re-run when the PR description changes, so blocks-filled turns green after you fill a block.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv, then exactly the versions in uv.lock
        # --locked: fail instead of updating uv.lock, if it does not match pyproject.toml.
        run: pip install uv && uv sync --locked
      - name: Format check (ruff format)
        run: uv run ruff format --check .
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Tests (pytest, no network)
        run: uv run pytest

  blocks-filled:
    # Checks the PR title and the required template blocks for this PR's lane (fast / standard / two-views / quick).
    # The lane rules live in tools/pr_lane.py, so this job and review-gate use the same rules.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # needed to list the PR's changed files; nothing is written
    steps:
      - uses: actions/checkout@v7
      - name: Title and required blocks for this PR's lane
        env:
          # Via env, never inline in run: (script injection). Anyone who opens a PR writes the title and body;
          # pasted straight into the script, they could run as code. As environment variables they stay plain text.
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          FILES="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          export FILES
          python3 tools/pr_lane.py blocks
